<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Contour">
  <title>Contour</title>
  <!-- The mark is the app's own signature element: a recorded elevation profile drawn
       in straight segments, the way every route silhouette in the app is drawn, over
       the contour intervals the name comes from. It bleeds off both edges because a
       route profile is a section through a longer ride, not a self-contained shape. -->
  <defs>
    <clipPath id="ct-bounds">
      <rect width="64" height="64" rx="14" />
    </clipPath>
  </defs>
  <g clip-path="url(#ct-bounds)">
    <rect width="64" height="64" fill="#0B0C0D" />
    <!-- contour intervals, in the app's own chart-grid weight -->
    <g stroke="#26292D" stroke-width="1.5">
      <path d="M0 21h64" />
      <path d="M0 34h64" />
    </g>
    <!-- the terrain under the ridge, masking the intervals it rises above -->
    <path fill="#232A2F" d="M-2 45 12 34 22 40 34 16 46 32 56 23 66 29V66H-2Z" />
    <!-- the ridge itself -->
    <path fill="none" stroke="#8B84F7" stroke-width="3.6" stroke-linejoin="round"
          d="M-2 45 12 34 22 40 34 16 46 32 56 23 66 29" />
  </g>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#2E353B" />
</svg>
